# Campioni di tutte le voci maschili italiane Chirp 3 HD (gratuite). Serve GOOGLE_TTS_KEY. Non pubblica nulla.
name: Campioni voci Chirp 3 HD
on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-fkj7dg]
    paths: [voci/campioni_chirp.py]
permissions:
  contents: write
jobs:
  voci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install numpy && sudo apt-get install -y -q ffmpeg
      - run: python voci/campioni_chirp.py
        env:
          GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
      - run: |
          git config user.name "pipeline-bot"; git config user.email "bot@users.noreply.github.com"
          git add anteprime/voci-chirp3 && git commit -m "Campioni voci Chirp 3 HD" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep 10; done; exit 1
