# Anteprime del Reel cartoon (Bit animato, sottotitoli) con voci diverse. Serve GOOGLE_TTS_KEY. Non pubblica nulla.
name: Anteprime Reel cartoon
on:
  workflow_dispatch:
    inputs:
      solo: {description: "Numeri delle prove da rifare, es. 2,5 (vuoto = tutte)", default: ""}
  push:
    branches: [claude/project-thread-fkj7dg]
    paths: [voci/anteprime_cartoon.py, pipeline/cartoon/**, pipeline/reel_cartoon.py, pipeline/voce.py, .github/workflows/anteprime_cartoon.yml]
permissions:
  contents: write
jobs:
  anteprime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: |
          sudo apt-get install -y -q ffmpeg fonts-dejavu-core
          pip install numpy google-auth requests
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
      - run: python voci/anteprime_cartoon.py
        env:
          SOLO: ${{ inputs.solo }}
          GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
      - run: |
          git config user.name "pipeline-bot"; git config user.email "bot@users.noreply.github.com"
          git add anteprime/cartoon && git commit -m "Anteprime Reel cartoon" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep 10; done; exit 1
