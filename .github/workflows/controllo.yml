# Ogni 2 ore cerca nuovi post e crea bozze. Non pubblica: la pubblicazione è manuale.
name: Controllo nuovi post
on:
  schedule: [{cron: "0 */2 * * *"}]
  workflow_dispatch:
    inputs:
      backfill:
        description: "Solo al primo avvio: quanti post recenti trasformare in bozze di prova"
        default: "0"
      rigenera:
        description: "ID delle bozze da rigenerare, separati da virgola"
        default: ""
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt && sudo apt-get install -y -q fonts-dejavu-core
      - run: python run.py check --backfill "${{ inputs.backfill || '0' }}" --rigenera "${{ inputs.rigenera }}"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          BRAND_HANDLE: ${{ vars.BRAND_HANDLE || '@bitquotidiano.it' }}
      - name: Salva bozze e stato nel repository
        run: |
          git config user.name "pipeline-bot"; git config user.email "bot@users.noreply.github.com"
          git add drafts state && git commit -m "Nuove bozze" && git push || echo "Nessuna novità"
