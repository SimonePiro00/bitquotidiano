# Campioni di voci italiane più naturali (Piper paola, Kokoro sara e nicola). Non pubblica nulla.
name: Campioni voce 2
on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-1obi9s]
    paths: [voci/campioni2.sh]
permissions:
  contents: write
jobs:
  voci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: |
          sudo apt-get install -y -q ffmpeg espeak-ng
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy piper-tts kokoro soundfile
      - run: bash voci/campioni2.sh
      - run: |
          git config user.name "pipeline-bot"; git config user.email "bot@users.noreply.github.com"
          git add voci/campioni2 && git commit -m "Campioni voce 2" && git push || echo "Nessuna novità"
