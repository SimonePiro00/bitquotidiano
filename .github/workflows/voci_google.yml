# Campioni delle voci italiane di Google Cloud Text-to-Speech. Serve il secret GOOGLE_TTS_KEY. Non pubblica nulla.
name: Campioni voce Google
on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-1obi9s]
    paths: [voci/campioni_google.py]
permissions:
  contents: write
jobs:
  voci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install numpy && sudo apt-get install -y -q ffmpeg
      - run: python voci/campioni_google.py
        env:
          GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
          BIT_VELOCITA: "1.08"
      - run: |
          git config user.name "pipeline-bot"; git config user.email "bot@users.noreply.github.com"
          git add voci/campioni_google && git commit -m "Campioni voce Google" && git push || echo "Nessuna novità"
