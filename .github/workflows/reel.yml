# Rigenera i Reel delle bozze indicate con la voce scelta (le voci Kokoro si scaricano solo da qui). Non pubblica nulla.
name: Crea Reel con voce
on:
  workflow_dispatch:
    inputs:
      id: {description: "ID delle bozze separati da spazio", required: true}
      voce: {description: "sara, nicola, paola, riccardo", default: "sara"}
  push:
    branches: [claude/project-thread-1obi9s]
    paths: [voci/reel_richiesta.txt]   # prima riga: voce, seconda: ID delle bozze
permissions:
  contents: write
jobs:
  reel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: |
          sudo apt-get install -y -q ffmpeg espeak-ng fonts-dejavu-core libcairo2
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt numpy piper-tts kokoro soundfile
      - run: |
          if [ -z "$ID" ]; then VOCE=$(sed -n 1p voci/reel_richiesta.txt); ID=$(sed -n 2p voci/reel_richiesta.txt); fi
          BIT_VOCE="$VOCE" python run.py reel $ID --voce
        env:
          ID: ${{ inputs.id }}
          VOCE: ${{ inputs.voce }}
          GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
      - run: |
          git config user.name "pipeline-bot"; git config user.email "bot@users.noreply.github.com"
          git add drafts && git commit -m "Reel con voce" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep 10; done; exit 1
