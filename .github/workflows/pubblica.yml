# Pubblicazione manuale: Actions > "Pubblica bozza" > Run workflow, inserendo l'ID della bozza.
name: Pubblica bozza
on:
  workflow_dispatch:
    inputs:
      id: {description: "ID della bozza (nome della cartella in drafts/)", required: true}
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: python run.py publish "${{ inputs.id }}" --conferma
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          PUBLIC_IMAGE_BASE_URL: ${{ vars.PUBLIC_IMAGE_BASE_URL || format('https://{0}.github.io/{1}/drafts', github.repository_owner, github.event.repository.name) }}
      - run: |
          git config user.name "pipeline-bot"; git config user.email "bot@users.noreply.github.com"
          git add drafts && git commit -m "Bozza ${{ inputs.id }} pubblicata" && git push || true
