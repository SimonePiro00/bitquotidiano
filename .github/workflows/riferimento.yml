# Una tantum: legge il Reel di riferimento indicato da Simone per studiarne lo stile. Non salva né pubblica nulla.
name: Leggi Reel di riferimento
on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-fkj7dg]
    paths: [voci/riferimento.py]
jobs:
  leggi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests && sudo apt-get install -y -q ffmpeg
      - run: python voci/riferimento.py
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
